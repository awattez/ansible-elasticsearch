      versions:
        - "8"
        - "9"
    - name: Debian
      versions:
        - bookworm
    - name: Ubuntu
      versions:
        - jammy
        - noble
  galaxy_tags:
    - elastic
    - elasticsearch
    - elk
    - logging

dependencies: []
