---
- name: reload systemd configuration
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart elasticsearch
  become: true
  ansible.builtin.service:
    name: elasticsearch
    state: restarted
    enabled: true
  when:
    - es_restart_on_change
    - es_start_service
  register: es_restarted
