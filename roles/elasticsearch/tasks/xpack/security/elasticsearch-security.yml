---
# Keystore management: bootstrap password for the elastic user + custom
# secure settings (es_keystore_entries).

- name: create the keystore if it doesn't exist yet
  become: true
  ansible.builtin.command: "{{ es_home }}/bin/elasticsearch-keystore create"
  args:
    creates: "{{ es_conf_dir }}/elasticsearch.keystore"
  environment:
    ES_PATH_CONF: "{{ es_conf_dir }}"

- name: List keystore entries
  become: true
  ansible.builtin.command: "{{ es_home }}/bin/elasticsearch-keystore list"
  register: list_keystore
  changed_when: false
  environment:
    ES_PATH_CONF: "{{ es_conf_dir }}"
  check_mode: false

# bootstrap.password seeds the 'elastic' user password before first start -
# this is how the role guarantees API access on a fresh 9.x cluster.
- name: Create bootstrap password for elastic user
  become: true
  ansible.builtin.command: "{{ es_home }}/bin/elasticsearch-keystore add -x bootstrap.password"
  args:
    stdin: "{{ es_api_basic_auth_password }}"
  notify: restart elasticsearch
  when:
    - es_api_basic_auth_username is defined
    - es_api_basic_auth_username == 'elastic'
    - "'bootstrap.password' not in list_keystore.stdout_lines"
  environment:
    ES_PATH_CONF: "{{ es_conf_dir }}"
  no_log: true

- name: Remove keystore entries
  become: true
  ansible.builtin.command: "{{ es_home }}/bin/elasticsearch-keystore remove {{ item.key | quote }}"
  notify: restart elasticsearch
  with_items: "{{ es_keystore_entries }}"
  when:
    - es_keystore_entries is defined and es_keystore_entries | length > 0
    - item.state is defined and item.state == 'absent'
    - item.key in list_keystore.stdout_lines
    - ('bootstrap.password' not in item.key)
  no_log: true
  environment:
    ES_PATH_CONF: "{{ es_conf_dir }}"

- name: Reload keystore entries
  become: true
  ansible.builtin.command: "{{ es_home }}/bin/elasticsearch-keystore list"
  register: list_keystore
  changed_when: false
  environment:
    ES_PATH_CONF: "{{ es_conf_dir }}"
  check_mode: false

- name: Add keystore entries
  become: true
  ansible.builtin.command: "{{ es_home }}/bin/elasticsearch-keystore add -x -f {{ item.key | quote }}"
  args:
    stdin: "{{ item.value }}"
  notify: restart elasticsearch
  with_items: "{{ es_keystore_entries }}"
  when:
    - es_keystore_entries is defined and es_keystore_entries | length > 0
    - item.state is undefined or item.state == 'present'
    - item.force | default(false) or (not item.force | default(false) and item.key not in list_keystore.stdout_lines)
    - ('bootstrap.password' not in item.key)
  no_log: true
  environment:
    ES_PATH_CONF: "{{ es_conf_dir }}"

# Encrypted PEM key (es_ssl_key_passphrase): the passphrase is a secure
# setting, one entry per enabled TLS layer.
- name: Add TLS key passphrase to the keystore
  become: true
  ansible.builtin.command: "{{ es_home }}/bin/elasticsearch-keystore add -x -f {{ item.setting }}"
  args:
    stdin: "{{ es_ssl_key_passphrase }}"
  notify: restart elasticsearch
  loop:
    - setting: xpack.security.http.ssl.secure_key_passphrase
      enabled: "{{ es_enable_http_ssl }}"
    - setting: xpack.security.transport.ssl.secure_key_passphrase
      enabled: "{{ es_enable_transport_ssl }}"
  loop_control:
    label: "{{ item.setting }}"
  when:
    - es_ssl_key_passphrase | length > 0
    - item.enabled | bool
    - item.setting not in list_keystore.stdout_lines
  no_log: true
  environment:
    ES_PATH_CONF: "{{ es_conf_dir }}"
