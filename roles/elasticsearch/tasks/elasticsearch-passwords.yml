---
# Set passwords of existing users (built-in ones like kibana_system included)
# through the security API. Creating users/roles is out of scope - use Kibana
# or the API directly.
- name: Set user passwords
  ansible.builtin.uri:
    url: "{{ es_api_uri }}/_security/user/{{ item.key }}/_password"
    method: POST
    body_format: json
    body:
      password: "{{ item.value }}"
    user: "{{ es_api_basic_auth_username }}"
    password: "{{ es_api_basic_auth_password }}"
    force_basic_auth: true
    status_code: 200
    validate_certs: "{{ es_validate_certs }}"
  loop: "{{ es_user_passwords | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: password_set
  until: password_set.status == 200
  retries: 12
  delay: 5
  no_log: true
