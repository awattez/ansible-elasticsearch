---
- name: Converge
  hosts: all
  become: true
  roles:
    - role: awattez.elastic.elasticsearch
      vars:
        es_version: "9.5.2"
        es_version_lock: true
        es_heap_size: 1g
        es_jvm_custom_parameters:
          - "-XX:+UseG1GC"
        # discovery/network.host computed by the role (single host).
        es_config:
          xpack.security.enabled: false
          xpack.security.http.ssl.enabled: false
          xpack.security.transport.ssl.enabled: false
          http.port: 9200
          node.roles: [master, data, ingest]
          cluster.name: test-cluster
          node.attr.rack_id: test-rack
          cluster.routing.allocation.awareness.attributes: rack_id
        es_config_log4j2: "{{ lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') }}/files/log4j2.properties"
        es_plugins:
          - plugin: analysis-icu
        es_keystore_entries:
          - key: s3.client.demo.access_key
            value: test-access-key
            state: present
          - key: s3.client.demo.secret_key
            value: test-secret-key
            state: present
