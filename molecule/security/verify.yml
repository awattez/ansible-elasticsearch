---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert Elasticsearch is running
      ansible.builtin.assert:
        that:
          - "'elasticsearch.service' in ansible_facts.services"
          - "ansible_facts.services['elasticsearch.service'].state == 'running'"

    - name: Wait for Elasticsearch HTTPS API
      ansible.builtin.uri:
        url: "https://localhost:9200"
        url_username: elastic
        url_password: "changeme"
        validate_certs: false
        status_code: 200
      register: api_response
      until: api_response.status == 200
      retries: 30
      delay: 10

    - name: Assert correct version
      ansible.builtin.assert:
        that:
          - "api_response.json.version.number == '9.5.2'"
        fail_msg: "Expected 9.5.2, got {{ api_response.json.version.number }}"

    - name: Stat key and certificate deployed by the role
      ansible.builtin.stat:
        path: "/etc/elasticsearch/certs/{{ item }}"
      register: deployed_material
      loop:
        - test.crt
        - test.key

    - name: Verify SSL material deployed to the Elasticsearch cert directory
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == 'elasticsearch'
      loop: "{{ deployed_material.results }}"
      loop_control:
        label: "{{ item.item }}"
